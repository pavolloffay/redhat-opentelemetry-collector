# Verified FIPS allowlist for the Red Hat OpenTelemetry Collector.
# Each entry documents a non-FIPS crypto import chain that has been reviewed
# and determined acceptable for our FIPS deployment.
# The chain is the exact import path from the root module package to the direct importer.
# If a new code path imports the same crypto package, it must be verified and added here.

allow:
  # --- OIDC auth extension: go-jose ---
  # The OIDC auth extension uses go-jose only for JWS signature verification (ParseSigned, Verify,
  # Claims) to validate OIDC/JWT tokens. It does not use JWE encryption/decryption (no Encrypt,
  # Decrypt, NewEncrypter, or PBES2 calls). The non-FIPS concern in go-jose is its JWE PBES2 key
  # derivation which this code never exercises.
  - package: github.com/go-jose/go-jose/v4
    chain:
      - github.com/openshift/redhat-opentelemetry-collector
      - github.com/open-telemetry/opentelemetry-collector-contrib/extension/oidcauthextension
      - github.com/coreos/go-oidc/v3/oidc
    reason: go-jose used only for JWS signature verification (ParseSigned/Verify), not JWE encryption

  - package: github.com/go-jose/go-jose/v4
    chain:
      - github.com/openshift/redhat-opentelemetry-collector
      - github.com/open-telemetry/opentelemetry-collector-contrib/extension/oidcauthextension
    reason: go-jose used only for JWS signature verification (ParseSigned/Verify), not JWE encryption

  # Kerberos auth is not supported in the product.
  # --- Kafka exporter: Kerberos authentication (aescts, gofork, gokrb5) ---
  # The Kafka exporter directly supports Kerberos SASL as a configurable authentication mechanism.
  # When configured, it uses jcmturner/gokrb5 to create clients, load keytabs, and authenticate
  # via GSS-API. gokrb5 uses its own non-FIPS crypto implementations (AES-CTS, DES, RC4).
  # These code paths are only reached when Kerberos authentication is explicitly configured
  # in the Kafka exporter config (Authentication.Kerberos != nil).
  - package: github.com/jcmturner/aescts/v2
    chain:
      - github.com/openshift/redhat-opentelemetry-collector
      - github.com/open-telemetry/opentelemetry-collector-contrib/exporter/kafkaexporter
      - github.com/open-telemetry/opentelemetry-collector-contrib/internal/kafka
      - github.com/jcmturner/gokrb5/v8/keytab
      - github.com/jcmturner/gokrb5/v8/crypto
      - github.com/jcmturner/gokrb5/v8/crypto/rfc3962
    reason: Kafka Kerberos SASL auth (configurable), uses non-FIPS AES-CTS; only active when Kerberos is configured

  - package: github.com/jcmturner/aescts/v2
    chain:
      - github.com/openshift/redhat-opentelemetry-collector
      - github.com/open-telemetry/opentelemetry-collector-contrib/exporter/kafkaexporter
      - github.com/open-telemetry/opentelemetry-collector-contrib/internal/kafka
      - github.com/jcmturner/gokrb5/v8/keytab
      - github.com/jcmturner/gokrb5/v8/crypto
      - github.com/jcmturner/gokrb5/v8/crypto/rfc8009
    reason: Kafka Kerberos SASL auth (configurable), uses non-FIPS AES-CTS; only active when Kerberos is configured

