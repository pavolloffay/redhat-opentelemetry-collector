  # --- Prometheus receiver: bcrypt/blowfish ---
  # The Prometheus receiver's apiserver uses exporter-toolkit's web.Serve for HTTP serving.
  # exporter-toolkit supports bcrypt-based HTTP basic auth, but the receiver hardcodes the
  # web config path to "" (apiserver/manager.go:220), so no web config is loaded and the
  # basic auth handler is never reached — bcrypt.CompareHashAndPassword is never called.
  - package: golang.org/x/crypto/bcrypt
    chain:
      - github.com/openshift/redhat-opentelemetry-collector
      - github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver
      - github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver/internal/apiserver
      - github.com/prometheus/exporter-toolkit/web
    reason: exporter-toolkit bcrypt for basic auth, but web config path is hardcoded empty so basic auth is never active

  - package: golang.org/x/crypto/blowfish
    chain:
      - github.com/openshift/redhat-opentelemetry-collector
      - github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver
      - github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver/internal/apiserver
      - github.com/prometheus/exporter-toolkit/web
      - golang.org/x/crypto/bcrypt
    reason: internal dependency of bcrypt; bcrypt is never called (see bcrypt entry above)

  # --- TLS config: chacha20/chacha20poly1305 via TPM keyfiles ---
  # configtls supports TPM-backed TLS keys (configurable, requires TPMConfig.Enabled=true).
  # When enabled, it uses go-tpm-keyfiles to load TPM keys. go-tpm-keyfiles imports
  # chacha20poly1305 but only uses the KeySize constant (32 bytes) for HKDF key sizing
  # in DeriveECDH — no ChaCha20-Poly1305 AEAD cipher is constructed or used.
  - package: golang.org/x/crypto/chacha20
    chain:
      - github.com/openshift/redhat-opentelemetry-collector
      - github.com/open-telemetry/opentelemetry-collector-contrib/extension/oauth2clientauthextension
      - go.opentelemetry.io/collector/config/configtls
      - github.com/foxboron/go-tpm-keyfiles
      - golang.org/x/crypto/chacha20poly1305
    reason: chacha20 imported by chacha20poly1305 in go-tpm-keyfiles; only KeySize constant used, no cipher operations

  - package: golang.org/x/crypto/chacha20poly1305
    chain:
      - github.com/openshift/redhat-opentelemetry-collector
      - github.com/open-telemetry/opentelemetry-collector-contrib/extension/oauth2clientauthextension
      - go.opentelemetry.io/collector/config/configtls
      - github.com/foxboron/go-tpm-keyfiles
    reason: go-tpm-keyfiles only uses chacha20poly1305.KeySize constant for HKDF sizing, no AEAD cipher constructed

  # --- Google Cloud exporter: chacha20poly1305 via S2A ---
  # S2A (Secure Session Agent) is Google's VM-to-VM mTLS transport, only active on GCE when the
  # metadata server provides an S2A address. The S2A Go client offers ChaCha20-Poly1305 as one of
  # three cipher suites; the actual cipher is selected by the remote S2A handshaker server.
  # On OpenShift (non-GCE) S2A is never activated (GetS2AAddress returns "").
  - package: golang.org/x/crypto/chacha20poly1305
    chain:
      - github.com/openshift/redhat-opentelemetry-collector
      - github.com/open-telemetry/opentelemetry-collector-contrib/exporter/googlecloudexporter
      - github.com/GoogleCloudPlatform/opentelemetry-operations-go/exporter/collector
      - google.golang.org/api/option
      - google.golang.org/api/internal
      - github.com/google/s2a-go
      - github.com/google/s2a-go/internal/handshaker
      - github.com/google/s2a-go/internal/record
      - github.com/google/s2a-go/internal/record/internal/halfconn
      - github.com/google/s2a-go/internal/record/internal/aeadcrypter
    reason: S2A mTLS transport, only active on GCE — not activated on OpenShift

  # --- Prometheus receiver: pkcs12 via Azure SDK ---
  # Transitive dependency: prometheusreceiver imports prometheus/config which pulls in the
  # Azure AD remote write module. The Prometheus receiver explicitly rejects remote_write and
  # remote_read configs at validation time (config.go:98-102), so Azure AD auth is unreachable.
  - package: golang.org/x/crypto/pkcs12
    chain:
      - github.com/openshift/redhat-opentelemetry-collector
      - github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver
      - github.com/prometheus/prometheus/config
      - github.com/prometheus/prometheus/storage/remote/azuread
      - github.com/Azure/azure-sdk-for-go/sdk/azidentity
    reason: transitive dep of prometheus/config; Prometheus receiver uses scrape config only, not remote write or Azure AD auth
